<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Instronic · Marcos Bodí</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/site-theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .access-panel { max-width: 28rem; }
    .access-panel h1 { font-size: clamp(2.75rem, 12vw, 4rem); letter-spacing: -.07em; margin: 0 0 1.5rem; }
    #access { display: grid; gap: .65rem; }
    input, button { box-sizing: border-box; min-height: 44px; border-radius: .25rem; padding: .65rem .85rem; font: inherit; }
    input { background: var(--card); color: var(--text); border: 1px solid var(--muted); }
    #access button { background: var(--text); border: 0; color: var(--bg); cursor: pointer; }
    #access button:hover { background: var(--accent); color: #fff; }
    @media (prefers-reduced-motion: no-preference) {
      #access button { transition: background-color .22s ease, color .22s ease; }
    }
    #status { min-height: 1.5em; color: var(--muted); }
  </style>
  <script src="/js/instronic-access.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/" aria-label="Portfolio de Marcos Bodí">MB</a>
  </header>
  <main class="project-page">
    <div class="access-panel">
      <h1>Instronic</h1>
      <form id="access" method="post">
        <label for="password">Contraseña de la propuesta</label>
        <input id="password" type="password" autocomplete="current-password" required maxlength="128" spellcheck="false">
        <button>Ver propuesta</button>
        <p id="status" role="status"></p>
      </form>
      <noscript>Activa JavaScript para abrir la propuesta.</noscript>
    </div>
  </main>
</body>
</html>
